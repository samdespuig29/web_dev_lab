<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div, input{
            margin: 5px;
        }
    </style>
</head>
<body>
    <p>Contacts Us</p>
    <div>
        <form>
            <label for="fname">Name</label>
            <input type="text" id="fname" name="fname" placeholder="Sam Despuig" required>
            <br>
            <label for="email">Email us</label>
            <input type="email" id="email" name="email" placeholder="samdespuig@gmail.com" required>
            <br>
            <label for="Message">Send us a message</label>
            <br>
            <textarea name="Message" id="Message" rows="5" cols="33" required></textarea>
            <br>
            <input type="reset" name="reset" id="reset">
            <br>
            <input type="submit" name="submit-btn" id="submit-btn">
        </form>    
    </div>
    <div>
        <a href="./index.html">
            <button style="background-color: #333333; color: #00ff00;border-radius: 2px;">main page</button>
        </a>
    </div>
    <div>
        <button style="background-color: #333333; color: #00ff00;border-radius: 2px;" > click me</button>
    </div>
    <button onclick="dosomething()" style="background-color: #333333; color: #00ff00;border-radius: 2px;" >Suprise</button>
    <p id="test">Hi!</p>
    <script>
        function dosomething(){
            document.getElementById("test").innerHTML = "Hello Sam";
        }
    </script>
</body>
</html>
